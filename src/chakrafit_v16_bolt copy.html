function genCode(email){
  const str = email.toLowerCase().trim() + '::' + MASTER_KEY;
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  let n = Math.abs(h);
  for(let i = 0; i < 8; i++){
    code += chars[n % chars.length];
    n = Math.floor(n / chars.length) || Math.abs(h * (i + 2)) % 1e9;
  }
  return code.slice(0, 4) + '-' + code.slice(4, 8);
}

function tod(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function yestStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dbet(a, b){ return Math.floor((new Date(b) - new Date(a)) / 864e5); }

function boot(){
  const t = tod(), ys = yestStr(), lo = LS.g('last_open', '');
  let day = LS.g('prog_day', 1);
  if(lo && lo !== t){ day = Math.min(30, day + dbet(lo, t)); LS.s('prog_day', day); }

  const storedStreak = LS.g('streak', 0), lc = LS.g('last_complete', '');
  const effStreak = (lc === t || lc === ys) ? storedStreak : 0;
  return { name: LS.g('name', ''), day, streak: effStreak, lc, today: t, yesterday: ys };
}

function parseSecs(reps){
  const r = reps.toLowerCase();
  const mC = r.match(/×\s*(\d+)\s*(min|seg)/); if(mC) return mC[2].startsWith('min') ? +mC[1]*60 : +mC[1];
  const mM = r.match(/(\d+)\s*min/); if(mM) return +mM[1]*60;
  const mS = r.match(/(\d+)\s*seg/); if(mS) return +mS[1];
  return 0;
}
function hasSide(r){ return /por lado/i.test(r); }

// ── CAMPANA AL TERMINAR ──
function playBell(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [[0, 528, 1.4],[0.75, 660, 1.1],[1.45, 396, 1.8]].forEach(([t, freq, dur]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, ac.currentTime + t);
      g.gain.linearRampToValueAtTime(0.22, ac.currentTime + t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + dur);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + dur + 0.1);
    });
  } catch(e){}
}

// ── TIMER ──
function Timer({ totalSecs, color, reps }){
  const [rem, sRem] = useState(totalSecs);
  const [run, sRun] = useState(true);
  const [done, sDone] = useState(false);
  const iv = useRef(null);
  useEffect(() => { sRem(totalSecs); sRun(true); sDone(false); }, [totalSecs]);

    clearInterval(iv.current);
    if(run && rem > 0){
      iv.current = setInterval(() => {
        sRem(r => { if(r <= 1){ clearInterval(iv.current); sDone(true); playBell(); return 0; } return r - 1; });
      }, 1000);
    }
    return () => clearInterval(iv.current);
  }, [run]);
  const m = Math.floor(rem/60), s = rem%60, R = 42, C = 2*Math.PI*R, off = C*(rem/totalSecs);
  return html`<div style=${{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'6px 0 4px' }}>
    ${hasSide(reps) && html`<div style=${{ background:'rgba(255,255,255,0.07)', borderRadius:20, padding:'4px 12px', fontSize:10, color:'#C7BCDA', fontWeight:600, letterSpacing:'1px' }}>${t('each_side')}</div>`}
    <div style=${{ position:'relative', width:110, height:110 }}>
      <svg width="110" height="110" viewBox="0 0 110 110" style=${{ transform:'rotate(-90deg)' }}>
        <circle cx="55" cy="55" r=${R} fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
        <circle cx="55" cy="55" r=${R} fill="none" stroke=${done ? '#5A9E6F' : color} stroke-width="7"
          stroke-dasharray=${C.toFixed(2)} stroke-dashoffset=${done ? C.toFixed(2) : off.toFixed(2)}
          stroke-linecap="round" style=${{ transition:'stroke-dashoffset 0.85s linear,stroke 0.3s' }}/>
      </svg>
      <div style=${{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
        ${done
          ? html`<span style=${{ fontSize:28 }}>✓</span>`
          : html`<span class="mn" style=${{ color:'#F3EFE6', fontSize:24, fontWeight:700 }}>${m}:${String(s).padStart(2,'0')}</span>`}
      </div>
    </div>
    ${done
      ? html`<p style=${{ color:'#5A9E6F', fontSize:13, fontWeight:700 }}>${t('time_done')}</p>`
      : html`<div style=${{ display:'flex', gap:8 }}>
          <button onClick=${() => {
            clearInterval(iv.current);
            sRun(r => {
              const nv = !r;
              if(nv && rem > 0){
                iv.current = setInterval(() => {
                  sRem(r2 => { if(r2 <= 1){ clearInterval(iv.current); sDone(true); return 0; } return r2 - 1; });
                }, 1000);
              }
              return nv;
            });
          }} style=${{ background:'rgba(255,255,255,0.09)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:50, color:'#C7BCDA', fontSize:12, padding:'7px 16px', cursor:'pointer', fontFamily:'Inter', fontWeight:600 }}>${run ? t('pause') : t('resume')}</button>
          <button onClick=${() => { clearInterval(iv.current); sRem(totalSecs); sDone(false); sRun(true); }} style=${{ background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.09)', borderRadius:50, color:'#8B7FA8', fontSize:12, padding:'7px 12px', cursor:'pointer', fontFamily:'Inter' }}>↺</button>
        </div>`}
  </div>`;
}

function svgFor(n, c){
  const t = n.toLowerCase();
  if(/medita|respiro|pranayama|escaneo|integra|4-7-8|zumbido|humm|respirac/.test(t)) return SV.meditate(c);
  if(/sentad/.test(t)) return SV.squat(c);
  if(/puente|glút|elevacion/.test(t)) return SV.bridge(c);
  if(/estocad|lunge/.test(t)) return SV.squat(c);
  if(/árbol|arbol|águila|aguila|balanceo|un pie/.test(t)) return SV.tree(c);
  if(/mountain/.test(t)) return SV.mountain(c);
  if(/plank/.test(t)) return SV.plank(c);
  if(/push.?up|flexion/.test(t)) return SV.pushup(c);
  if(/pared/.test(t)) return SV.legwall(c);
  if(/saludo|sol completo/.test(t)) return SV.sunsal(c);
  if(/cobra|camello|pez/.test(t)) return SV.cobra(c);
  if(/twist|russian|core|crunch|bicicl/.test(t)) return SV.twist(c);
  if(/niño|mariposa|paloma|sukhasana/.test(t)) return SV.floor(c);
  if(/circulo|círculo|ondulat|movimiento|cader/.test(t)) return SV.hips(c);
  if(/apertura|roll|estira|trapec|hombro|cuello/.test(t)) return SV.stretch(c);
  return SV.meditate(c);
}
function Img({ name, color }){
  return html`<div style=${{ width:'100%', height:'100%', borderRadius:14, overflow:'hidden' }} dangerouslySetInnerHTML=${{ __html: svgFor(name, color) }}/>`;
}

// ── LOGIN ──
function EmailLogin({ onLogin }){
  const [email, sEmail] = useState('');
  const [code, sCode] = useState('');
  const [step, sStep] = useState(1);
  const [err, sErr] = useState('');
  const [shake, sShake] = useState(false);
  function nextStep(){
    const e = email.trim().toLowerCase();
    if(!e.includes('@')){ sErr(t('valid_email')); return; }
    sErr('');
    if(e === ADMIN){ doLogin(e, ''); } else { sStep(2); }
  }
  function doLogin(e, c){
    if(verifyAccess(e, c)){ LS.s('email', e); onLogin(e); }
    else { sErr(t('wrong_code')); sShake(true); setTimeout(() => sShake(false), 600); }
  }
  return html`<div style=${{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'40px 28px', background:'radial-gradient(ellipse at 50% 20%,#2D1F45,#1E1530)', animation:'pp 0.4s cubic-bezier(.34,1.56,.64,1) both' }}>
    <div style=${{ textAlign:'center', width:'100%' }}>
      <div style=${{ fontSize:52, marginBottom:16, animation:'br 3s ease-in-out infinite' }}>🌸</div>
      <h1 class="fr" style=${{ color:'#F3EFE6', fontSize:24, fontWeight:600, marginBottom:6 }}>${t('welcome')}</h1>
      <p style=${{ color:'#8B7FA8', fontSize:13, marginBottom:28, lineHeight:1.6 }}>${t('private_comm')}<br/>${t('enter_email_hint')}</p>
      ${step === 1 && html`<div style=${{ animation:shake ? 'sh 0.4s ease' : 'none', marginBottom:12 }}>
        <input class="ip" type="email" placeholder="tu@correo.com" value=${email}
          onInput=${e => { sEmail(e.target.value); sErr(''); }}
          onKeyDown=${e => { if(e.key === 'Enter') nextStep(); }}
          style=${{ textAlign:'center', fontSize:15 }}/>
      </div>`}
      ${step === 2 && html`<div style=${{ marginBottom:4 }}>
        <div style=${{ display:'flex', alignItems:'center', gap:8, marginBottom:12, padding:'8px 12px', background:'rgba(255,255,255,0.05)', borderRadius:12 }}>
          <span style=${{ fontSize:13, color:'#8B7FA8', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${email}</span>
          <button onClick=${() => { sStep(1); sErr(''); sCode(''); }} style=${{ background:'none', border:'none', color:'#E0AD66', fontSize:12, cursor:'pointer', fontFamily:'Inter', flexShrink:0 }}>${t('change')}</button>
        </div>
        <p style=${{ color:'#C7BCDA', fontSize:12, marginBottom:10, textAlign:'left' }}>${t('enter_code_hint')}</p>
        <div style=${{ animation:shake ? 'sh 0.4s ease' : 'none', marginBottom:12 }}>
          <input class="ip" placeholder="XXXX-XXXX" value=${code}
            onInput=${e => { sCode(e.target.value.toUpperCase()); sErr(''); }}
            onKeyDown=${e => { if(e.key === 'Enter') doLogin(email.trim().toLowerCase(), code); }}
            style=${{ textAlign:'center', fontSize:18, letterSpacing:'4px', fontFamily:'Space Grotesk' }}
            maxLength="9"/>
        </div>
      </div>`}
      ${err && html`<div style=${{ background:'rgba(196,75,75,0.12)', border:'1px solid rgba(196,75,75,0.3)', borderRadius:12, padding:'10px 14px', marginBottom:12 }}>
        <p style=${{ color:'#E07070', fontSize:13 }}>🔒 ${err}</p>
      </div>`}
      <button class="bg" onClick=${step === 1 ? nextStep : () => doLogin(email.trim().toLowerCase(), code)} style=${{ marginBottom:16 }}>
        ${step === 1 ? t('continue_btn') : t('enter_btn')}
      </button>
      <p style=${{ color:'#4A3F5C', fontSize:11, lineHeight:1.6 }}>${t('no_code').split('\n').map((l,i) => html`${i>0?html`<br/>`:null}${l}`)}</p>
    </div>
  </div>`;
}

// ── AUDIO DE MEDITACIÓN (Web Audio API) ──
const CHAKRA_AUDIO = {
  raiz:     { hz:396, mantra:'LAM', label:'396 Hz · Liberación del miedo',       color:'#C44B4B' },
  sacro:    { hz:417, mantra:'VAM', label:'417 Hz · Creatividad y flujo',         color:'#E07A3A' },
  solar:    { hz:528, mantra:'RAM', label:'528 Hz · Transformación y poder',      color:'#D9AE3F' },
  corazon:  { hz:639, mantra:'YAM', label:'639 Hz · Amor y conexión',             color:'#5A9E6F' },
  garganta: { hz:741, mantra:'HAM', label:'741 Hz · Expresión y verdad',          color:'#4A90C4' },
  tojo:     { hz:852, mantra:'AUM', label:'852 Hz · Intuición y claridad',        color:'#7B68C8' },
  corona:   { hz:963, mantra:'OM',  label:'963 Hz · Consciencia pura',            color:'#A87DC8' },
};

function isMeditacion(name){
  return /meditaci|pranayama|escaneo|humming|zumbido|nadi|integrac/i.test(name);
}

function MeditationAudio({ phaseId, stepName, color }){
  const info = CHAKRA_AUDIO[phaseId] || CHAKRA_AUDIO.corona;
  const [playing, sPlaying] = useState(false);
  const [vol, sVol] = useState(0.4);
  const ctx = useRef(null);
  const nodes = useRef({});

  function startAudio(){
    if(!ctx.current) ctx.current = new (window.AudioContext || window.webkitAudioContext)();
    const ac = ctx.current;
    if(ac.state === 'suspended') ac.resume();

    // Ganancia master con fade in suave
    const master = ac.createGain();
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(vol, ac.currentTime + 2);
    master.connect(ac.destination);

    // Tono principal (frecuencia del chakra) — onda sinusoidal pura
    const osc1 = ac.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = info.hz;
    const g1 = ac.createGain(); g1.gain.value = 0.6;
    osc1.connect(g1); g1.connect(master);
    osc1.start();

    // Beat binaural: canal izquierdo + derecho con 6 Hz de diferencia (theta)
    const merger = ac.createChannelMerger(2);
    const oscL = ac.createOscillator(), oscR = ac.createOscillator();
    oscL.type = 'sine'; oscL.frequency.value = info.hz;
    oscR.type = 'sine'; oscR.frequency.value = info.hz + 6;
    const gL = ac.createGain(), gR = ac.createGain();
    gL.gain.value = 0.25; gR.gain.value = 0.25;
    oscL.connect(gL); gL.connect(merger, 0, 0);
    oscR.connect(gR); gR.connect(merger, 0, 1);
    merger.connect(master);
    oscL.start(); oscR.start();

    // Armónico suave (octava) para calidez
    const osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = info.hz / 2;
    const g2 = ac.createGain(); g2.gain.value = 0.15;
    osc2.connect(g2); g2.connect(master);
    osc2.start();

    nodes.current = { master, osc1, oscL, oscR, osc2 };
  }

  function stopAudio(){
    const { master, osc1, oscL, oscR, osc2 } = nodes.current;
    if(!master) return;
    const ac = ctx.current;
    master.gain.setValueAtTime(master.gain.value, ac.currentTime);
    master.gain.linearRampToValueAtTime(0, ac.currentTime + 1.5);
    setTimeout(() => {
      [osc1, oscL, oscR, osc2].forEach(o => { try{ o.stop(); }catch(e){} });
    }, 1600);
    nodes.current = {};
  }

  useEffect(() => {
    return () => { if(playing) stopAudio(); };
  }, []);

  function toggle(){
    if(playing){ stopAudio(); sPlaying(false); }
    else { startAudio(); sPlaying(true); }
  }

  function changeVol(e){
    const v = parseFloat(e.target.value);
    sVol(v);
    if(nodes.current.master) nodes.current.master.gain.setTargetAtTime(v, ctx.current.currentTime, 0.1);
  }

  const c = color || info.color;
  const bars = [0.4,0.7,1,0.8,0.5,0.9,0.6,1,0.7,0.4,0.8,0.5];

  return html`<div style=${{ background:'rgba(0,0,0,0.25)', border:'1px solid ' + c + '40', borderRadius:18, padding:'14px 16px', marginBottom:14 }}>
    <div style=${{ display:'flex', alignItems:'center', gap:10, marginBottom:12 }}>
      <div style=${{ flexShrink:0 }}>
        <div style=${{ width:44, height:44, borderRadius:'50%', background: playing ? c : 'rgba(255,255,255,0.06)', border:'2px solid ' + c, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'all 0.3s', boxShadow: playing ? '0 0 18px ' + c + '60' : 'none' }} onClick=${toggle}>
          ${playing
            ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="${c === '#D9AE3F' ? '#2A2235' : '#F3EFE6'}"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
            : html`<svg width="14" height="14" viewBox="0 0 24 24" fill=${c}><path d="M8 5V19L19 12L8 5Z"/></svg>`}
        </div>
      </div>
      <div style=${{ flex:1, minWidth:0 }}>
        <p style=${{ color:'#F3EFE6', fontSize:12, fontWeight:700, marginBottom:2 }}>🎵 ${t('sound_of')} ${info.mantra}</p>
        <p style=${{ color:c, fontSize:11 }}>${info.label}</p>
      </div>
      <span class="mn" style=${{ color:'#8B7FA8', fontSize:10, flexShrink:0 }}>${playing ? t('playing') : t('silence')}</span>
    </div>

    <!-- Ondas animadas -->
    <div style=${{ display:'flex', alignItems:'center', justifyContent:'center', gap:3, height:32, marginBottom:12 }}>
      ${bars.map((h, i) => html`<div key=${i} style=${{
        width:3, borderRadius:3,
        height: playing ? (h * 28) + 'px' : '4px',
        background: playing ? c : 'rgba(255,255,255,0.12)',
        transition:'height 0.3s ease, background 0.3s',
        animation: playing ? ('wv ' + (0.6 + i*0.08) + 's ease-in-out infinite alternate') : 'none',
        animationDelay: (i * 0.06) + 's'
      }}/>`)}
    </div>

    <!-- Control de volumen -->
    <div style=${{ display:'flex', alignItems:'center', gap:8 }}>
      <span style=${{ fontSize:12 }}>🔈</span>
      <input type="range" min="0.05" max="0.8" step="0.05" value=${vol} onInput=${changeVol}
        style=${{ flex:1, accentColor:c, cursor:'pointer', height:3 }}/>
      <span style=${{ fontSize:12 }}>🔊</span>
    </div>

    <p style=${{ color:'#4A3F5C', fontSize:10, textAlign:'center', marginTop:8, lineHeight:1.5 }}>
      Beat binaural · onda theta 6 Hz · usa audífonos para mayor efecto
    </p>
  </div>
  <style>@keyframes wv { from { transform:scaleY(0.4); } to { transform:scaleY(1); } }</style>`;
}

  const [rSteps, sRSteps] = useState({});

  if(!email) return html`<${EmailLogin} onLogin=${e => sEmail(e)}/>`;
  if(!name) return html`<${Setup} onSave=${n => { sName(n); LS.s('name', n); }}/>`;

  if(view === 'admin') return html`<div style=${{ display:'flex', flexDirection:'column', height:'100%' }}>
    <${AdminPanel} onBack=${() => sView('home')} onLogout=${logout}/>
  </div>`;

  if(editing) return html`<div style=${{ flex:1, background:'linear-gradient(#2D1F45,#1E1530)', padding:'60px 24px 0', display:'flex', flexDirection:'column', gap:14 }}>
    <h2 class="fr" style=${{ color:'#F3EFE6', fontSize:22, fontWeight:600 }}>¿Cómo te llamas?</h2>
    <input class="ip" value=${ni} onInput=${e => sNi(e.target.value)} onKeyDown=${e => { if(e.key === 'Enter' && ni.trim()){ sName(ni.trim()); LS.s('name', ni.trim()); sEditing(false); } }}/>
    <button class="bg" onClick=${() => { if(ni.trim()){ sName(ni.trim()); LS.s('name', ni.trim()); sEditing(false); } }}>Guardar</button>
    <button onClick=${() => sEditing(false)} style=${{ background:'none', border:'none', color:'#8B7FA8', cursor:'pointer', fontSize:14, fontFamily:'Inter' }}>Cancelar</button>
  </div>`;

  function regWorkout(){
    const t = tod(); if(lc === t) return;
    const ns = lc === yesterday ? streak + 1 : 1;
    sStreak(ns); sLc(t); LS.s('streak', ns); LS.s('last_complete', t);
  }
  function go(v, pid){ if(pid) sPhase(pid); sView(v); }
  function openEx(i){ sExIdx(i); sView('ex'); }
  const done = lc === today;
  const navActive = { home:'home', oracle:'oracle', routines:'routines', 'routine-summary':'routines', ex:'routines', rituals:'home', 'ritual-detail':'home' }[view] || 'home';

  return html`<div style=${{ display:'flex', flexDirection:'column', height:'100%', position:'relative' }}>
    ${view === 'home' && html`<${Home} st=${{ name, day, streak, lc, today }} go=${go} editName=${() => { sNi(name); sEditing(true); }}/>`}
    ${view === 'oracle' && html`<${Oracle} day=${day}/>`}
    ${view === 'routines' && html`<${RoutineList} day=${day} go=${go}/>`}
    ${view === 'routine-summary' && html`<${RoutineSummary} phaseId=${phase} day=${day} back=${() => sView('routines')} openEx=${openEx}/>`}
    ${view === 'ex' && html`<${ExDetail} phaseId=${phase} day=${day} startIdx=${exIdx} back=${() => sView('routine-summary')} onComplete=${regWorkout} done=${done} streak=${streak}/>`}
    ${view === 'rituals' && html`<${Rituals} cR=${cRituals} go=${go} onSelect=${r => { sRitual(r); sView('ritual-detail'); }}/>`}
    ${view === 'ritual-detail' && ritual && html`<${RitualDetail} ritual=${ritual} cSteps=${rSteps[ritual.id] || new Set()} back=${() => sView('rituals')} toggle=${i => { sRSteps(m => { const s = new Set(m[ritual.id] || []); s.has(i) ? s.delete(i) : s.add(i); return { ...m, [ritual.id]: s }; }); }} complete=${() => { sCRituals(s => new Set([...s, ritual.id])); sView('rituals'); }}/>`}
    <${Nav} active=${navActive} go=${v => sView(v)} isAdmin=${isAdmin} openAdmin=${() => sView('admin')}/>
  </div>`;
}

render(html`<${App}/>`, document.getElementById('as'));
})();
</script>
</body>
</html>
